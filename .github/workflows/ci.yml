name: CI

on:
  push:
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier que le code est valide
        run: python -m compileall -q app config.py main.py

      - name: Lancer le programme et quitter
        run: echo "0" | python main.py
